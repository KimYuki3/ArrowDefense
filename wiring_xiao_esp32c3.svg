<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 990" width="1280" height="990" font-family="'Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif" font-size="14">
  <title>Arrow Defense 回路図（XIAO ESP32C3）</title>
  <defs>
    <!-- GND記号（上端が接続点） -->
    <g id="gnd" stroke="#222" stroke-width="2" fill="none">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-8" y1="5" x2="8" y2="5"/>
      <line x1="-4" y1="10" x2="4" y2="10"/>
    </g>
  </defs>
  <style>
    .box { fill: #f4f6f8; stroke: #222; stroke-width: 2; }
    .sig { stroke: #1f5fbf; stroke-width: 2; fill: none; }
    .pwr { stroke: #d62828; stroke-width: 2.5; fill: none; }
    .v33 { stroke: #e07b00; stroke-width: 2; fill: none; }
    .gnd { stroke: #222; stroke-width: 2; fill: none; }
    .sw  { stroke: #7b3fb5; stroke-width: 2.5; fill: none; }
    .aud { stroke: #2a8a4a; stroke-width: 2; fill: none; }
    .name { font-weight: bold; font-size: 15px; fill: #111; }
    .pin { fill: #111; }
    .lbl { fill: #333; font-size: 13px; }
    .note { fill: #333; font-size: 13px; }
    .term { fill: #fff; stroke: #222; stroke-width: 2; }
    .flag { fill: #e8f0fc; stroke: #1f5fbf; stroke-width: 2; }
    .flagt { fill: #174a96; font-weight: bold; font-size: 13px; }
  </style>

  <rect width="1280" height="990" fill="#ffffff"/>
  <text x="60" y="48" font-size="24" font-weight="bold" fill="#111">Arrow Defense 回路図（XIAO ESP32C3 ＋ 803048P 電池 ＋ PCM5102A ＋ MOSFET）</text>
  <text x="60" y="76" class="lbl">線の色： <tspan fill="#d62828" font-weight="bold">赤＝電池の＋</tspan>　<tspan fill="#e07b00" font-weight="bold">橙＝3.3V</tspan>　<tspan fill="#1f5fbf" font-weight="bold">青＝信号</tspan>　<tspan fill="#2a8a4a" font-weight="bold">緑＝音声</tspan>　<tspan font-weight="bold">黒＝GND</tspan>　<tspan fill="#7b3fb5" font-weight="bold">紫＝MOSFETで切れるGND</tspan>　／　線が交わるところは ● があるときだけつながる</text>

  <!-- ===== XIAO ESP32C3 ===== -->
  <rect x="590" y="160" width="60" height="20" rx="4" fill="#ccd3da" stroke="#222" stroke-width="2"/>
  <text x="620" y="150" text-anchor="middle" class="lbl">USB-C（充電・書き込み）</text>
  <rect x="520" y="180" width="200" height="320" rx="8" class="box"/>
  <text x="620" y="325" text-anchor="middle" class="name">Seeed XIAO</text>
  <text x="620" y="346" text-anchor="middle" class="name">ESP32C3</text>
  <g class="pin">
    <text x="530" y="225">D0</text>
    <text x="530" y="265">D1</text>
    <text x="530" y="305">D2</text>
    <text x="530" y="345">D3</text>
    <text x="530" y="385">D4</text>
    <text x="530" y="425">D5</text>
    <text x="530" y="465">D6</text>
  </g>
  <g class="pin" text-anchor="end">
    <text x="710" y="225">5V</text>
    <text x="710" y="265">GND</text>
    <text x="710" y="305">3V3</text>
    <text x="710" y="345">D10</text>
    <text x="710" y="385">D9</text>
    <text x="710" y="425">D8</text>
    <text x="710" y="465">D7</text>
  </g>
  <text x="580" y="490" text-anchor="middle" class="pin">BAT+</text>
  <text x="660" y="490" text-anchor="middle" class="pin">BAT−</text>
  <text x="620" y="470" text-anchor="middle" class="lbl">（裏面のパッド）</text>

  <!-- D0 → 7セグ CLK（札でつなぐ） -->
  <line x1="520" y1="220" x2="492" y2="220" class="sig"/>
  <rect x="396" y="209" width="96" height="22" rx="4" class="flag"/>
  <text x="444" y="225" text-anchor="middle" class="flagt">7セグ CLK へ</text>
  <!-- D5 → MOSFET TRIG（札でつなぐ） -->
  <line x1="520" y1="420" x2="492" y2="420" class="sig"/>
  <rect x="372" y="409" width="120" height="22" rx="4" class="flag"/>
  <text x="432" y="425" text-anchor="middle" class="flagt">MOSFET TRIG へ</text>

  <!-- 5V は使わない -->
  <line x1="720" y1="220" x2="750" y2="220" class="gnd" stroke-dasharray="4 4"/>
  <text x="756" y="225" class="lbl">何もつながない</text>
  <!-- XIAO GND -->
  <polyline points="720,260 800,260 800,272" class="gnd"/>
  <use href="#gnd" x="800" y="272"/>
  <!-- XIAO 3V3 -->
  <line x1="720" y1="300" x2="752" y2="300" class="v33"/>
  <rect x="752" y="289" width="44" height="22" rx="4" fill="#fff3e0" stroke="#e07b00" stroke-width="2"/>
  <text x="774" y="305" text-anchor="middle" fill="#b85f00" font-weight="bold" font-size="13">3V3</text>

  <!-- ===== ボタン（D1〜D4） ===== -->
  <text x="150" y="232" text-anchor="middle" class="name">ボタン ×4</text>
  <polyline points="150,260 150,420" class="gnd"/>
  <use href="#gnd" x="150" y="420"/>
  <g>
    <circle cx="112" cy="260" r="9" fill="#e53935" stroke="#222" stroke-width="1.5"/>
    <text x="96" y="265" text-anchor="end" class="pin">赤</text>
    <line x1="150" y1="260" x2="180" y2="260" class="gnd"/>
    <line x1="180" y1="260" x2="236" y2="244" class="gnd"/>
    <line x1="240" y1="260" x2="520" y2="260" class="sig"/>
    <circle cx="180" cy="260" r="4" class="term"/><circle cx="240" cy="260" r="4" class="term"/>
    <circle cx="150" cy="260" r="4" fill="#222"/>

    <circle cx="112" cy="300" r="9" fill="#43a047" stroke="#222" stroke-width="1.5"/>
    <text x="96" y="305" text-anchor="end" class="pin">緑</text>
    <line x1="150" y1="300" x2="180" y2="300" class="gnd"/>
    <line x1="180" y1="300" x2="236" y2="284" class="gnd"/>
    <line x1="240" y1="300" x2="520" y2="300" class="sig"/>
    <circle cx="180" cy="300" r="4" class="term"/><circle cx="240" cy="300" r="4" class="term"/>
    <circle cx="150" cy="300" r="4" fill="#222"/>

    <circle cx="112" cy="340" r="9" fill="#1e88e5" stroke="#222" stroke-width="1.5"/>
    <text x="96" y="345" text-anchor="end" class="pin">青</text>
    <line x1="150" y1="340" x2="180" y2="340" class="gnd"/>
    <line x1="180" y1="340" x2="236" y2="324" class="gnd"/>
    <line x1="240" y1="340" x2="520" y2="340" class="sig"/>
    <circle cx="180" cy="340" r="4" class="term"/><circle cx="240" cy="340" r="4" class="term"/>
    <circle cx="150" cy="340" r="4" fill="#222"/>

    <circle cx="112" cy="380" r="9" fill="#fdd835" stroke="#222" stroke-width="1.5"/>
    <text x="96" y="385" text-anchor="end" class="pin">黄</text>
    <line x1="150" y1="380" x2="180" y2="380" class="gnd"/>
    <line x1="180" y1="380" x2="236" y2="364" class="gnd"/>
    <line x1="240" y1="380" x2="520" y2="380" class="sig"/>
    <circle cx="180" cy="380" r="4" class="term"/><circle cx="240" cy="380" r="4" class="term"/>
    <circle cx="150" cy="380" r="4" fill="#222"/>
  </g>

  <!-- ===== 7セグ TM1637 ===== -->
  <rect x="320" y="440" width="120" height="110" rx="6" class="box"/>
  <text x="380" y="538" text-anchor="middle" class="name">7セグ TM1637</text>
  <g class="pin" text-anchor="end">
    <text x="432" y="465">DIO</text>
    <text x="432" y="505">CLK</text>
  </g>
  <g class="pin">
    <text x="328" y="465">VCC</text>
    <text x="328" y="505">GND</text>
  </g>
  <line x1="440" y1="460" x2="520" y2="460" class="sig"/>
  <line x1="440" y1="500" x2="462" y2="500" class="sig"/>
  <rect x="462" y="489" width="50" height="22" rx="4" class="flag"/>
  <text x="487" y="505" text-anchor="middle" class="flagt">D0 へ</text>
  <line x1="320" y1="460" x2="288" y2="460" class="v33"/>
  <rect x="244" y="449" width="44" height="22" rx="4" fill="#fff3e0" stroke="#e07b00" stroke-width="2"/>
  <text x="266" y="465" text-anchor="middle" fill="#b85f00" font-weight="bold" font-size="13">3V3</text>
  <polyline points="320,500 296,500 296,516" class="gnd"/>
  <use href="#gnd" x="296" y="516"/>

  <!-- ===== テープLED ===== -->
  <text x="1100" y="290" text-anchor="middle" class="name">テープLED WS2812B（90個）</text>
  <rect x="1000" y="300" width="200" height="80" rx="6" class="box"/>
  <text x="1008" y="345" class="pin">DIN</text>
  <g class="pin" text-anchor="end">
    <text x="1192" y="330">5V</text>
    <text x="1192" y="360">GND</text>
  </g>
  <line x1="720" y1="340" x2="850" y2="340" class="sig"/>
  <rect x="850" y="332" width="60" height="16" fill="#fff" stroke="#1f5fbf" stroke-width="2"/>
  <text x="880" y="325" text-anchor="middle" class="lbl">330Ω</text>
  <line x1="910" y1="340" x2="1000" y2="340" class="sig"/>
  <!-- テープ GND → MOSFET OUT−（紫） -->
  <polyline points="1200,355 1222,355 1222,700 760,700" class="sw"/>
  <!-- テープ 5V ← 電池＋（赤） -->
  <polyline points="1200,325 1246,325 1246,760 760,760" class="pwr"/>

  <!-- ===== PCM5102A ===== -->
  <rect x="800" y="362" width="130" height="240" rx="6" class="box"/>
  <text x="922" y="392" text-anchor="end" class="name">PCM5102A</text>
  <text x="922" y="410" text-anchor="end" class="lbl">（I2S DAC）</text>
  <g class="pin">
    <text x="808" y="385">LCK</text>
    <text x="808" y="425">BCK</text>
    <text x="808" y="465">DIN</text>
    <text x="808" y="505">SCK</text>
    <text x="808" y="545">GND</text>
  </g>
  <text x="900" y="592" text-anchor="middle" class="pin">VIN</text>
  <text x="922" y="485" text-anchor="end" class="pin">3.5mm</text>
  <text x="922" y="502" text-anchor="end" class="lbl">ジャック</text>
  <line x1="720" y1="380" x2="800" y2="380" class="sig"/>
  <line x1="720" y1="420" x2="800" y2="420" class="sig"/>
  <line x1="720" y1="460" x2="800" y2="460" class="sig"/>
  <!-- SCK・GND → MOSFET OUT−（紫） -->
  <polyline points="800,500 780,500 780,700" class="sw"/>
  <line x1="800" y1="540" x2="780" y2="540" class="sw"/>
  <circle cx="780" cy="540" r="4.5" fill="#7b3fb5"/>
  <circle cx="780" cy="700" r="4.5" fill="#7b3fb5"/>
  <!-- VIN ← 電池＋（赤）。紫の線とは交わるだけ -->
  <polyline points="900,602 900,760" class="pwr"/>
  <circle cx="900" cy="760" r="4.5" fill="#d62828"/>

  <!-- ===== スピーカー ===== -->
  <rect x="1000" y="445" width="200" height="70" rx="6" class="box"/>
  <text x="1100" y="475" text-anchor="middle" class="name">アンプ内蔵スピーカー</text>
  <text x="1100" y="497" text-anchor="middle" class="lbl">または PAM8403＋スピーカー</text>
  <line x1="930" y1="480" x2="1000" y2="480" class="aud"/>

  <!-- ===== 電池 ===== -->
  <rect x="340" y="704" width="160" height="92" rx="6" class="box"/>
  <text x="412" y="740" text-anchor="middle" class="name">リチウムポリマー電池</text>
  <text x="412" y="762" text-anchor="middle" class="pin">803048P　3.7V</text>
  <text x="412" y="782" text-anchor="middle" class="lbl">（保護回路つき）</text>
  <text x="492" y="730" text-anchor="end" class="name" fill="#d62828">＋</text>
  <text x="492" y="790" text-anchor="end" class="name">−</text>
  <polyline points="500,782 530,782 530,800" class="gnd"/>
  <use href="#gnd" x="530" y="800"/>
  <!-- 電池＋ → BAT+ と MOSFET VIN+ -->
  <polyline points="500,740 600,740" class="pwr"/>
  <polyline points="580,740 580,500" class="pwr"/>
  <circle cx="580" cy="740" r="4.5" fill="#d62828"/>
  <!-- BAT− → GND -->
  <polyline points="660,500 660,540" class="gnd"/>
  <use href="#gnd" x="660" y="540"/>

  <!-- ===== MOSFETモジュール ===== -->
  
  <rect x="600" y="660" width="160" height="140" rx="6" class="box"/>
  <text x="608" y="684" class="name">MOSFETモジュール</text>
  <text x="608" y="702" class="lbl">（15A 400W）</text>
  <text x="608" y="745" class="pin">VIN+</text>
  <g class="pin" text-anchor="end">
    <text x="752" y="705">OUT−</text>
    <text x="752" y="765">OUT+</text>
  </g>
  <g class="pin" text-anchor="middle">
    <text x="636" y="792">TRIG</text>
    <text x="688" y="792">GND</text>
    <text x="736" y="792">VIN−</text>
  </g>
  <line x1="636" y1="800" x2="636" y2="826" class="sig"/>
  <rect x="611" y="826" width="50" height="22" rx="4" class="flag"/>
  <text x="636" y="842" text-anchor="middle" class="flagt">D5 へ</text>
  <line x1="688" y1="800" x2="688" y2="822" class="gnd"/>
  <use href="#gnd" x="688" y="822"/>
  <line x1="736" y1="800" x2="736" y2="822" class="gnd"/>
  <use href="#gnd" x="736" y="822"/>
  <text x="1060" y="692" text-anchor="middle" fill="#7b3fb5" font-weight="bold">MOSFETで切れる GND</text>
  <text x="1060" y="782" text-anchor="middle" fill="#d62828" font-weight="bold">電池の＋</text>

  <!-- ===== 注意書き ===== -->
  <line x1="60" y1="868" x2="1220" y2="868" stroke="#bbb" stroke-width="1"/>
  <g class="note">
    <text x="60" y="892">・GND記号（三本線）はすべて、電池の − と XIAO の GND につながっている。テープLED と PCM5102A の GND だけは、GND記号ではなく紫の線（MOSFET の OUT−）につなぐ。</text>
    <text x="60" y="914">・ボタンを3分さわらないと、XIAO が D5 を LOW にして MOSFET を切り、テープLED と PCM5102A の電源が切れる。ボタンの長押しで起きる。</text>
    <text x="60" y="936">・PCM5102A：SCK は GND 側（紫）へ。裏面のはんだジャンパは H3L だけ H 側、ほかは L 側。スピーカーは直接つなげない（アンプが必要）。</text>
    <text x="60" y="958">・PAM8403 など同じ電池で動かすアンプを足すときは、アンプの GND も紫の線へ。330Ω は無くても動く。5V ピンには何もつながない。</text>
    <text x="60" y="980">・同じ名前の札（「D0 へ」と「7セグ CLK へ」、「D5 へ」と「MOSFET TRIG へ」）どうしを1本の線でつなぐ。</text>
  </g>
</svg>
